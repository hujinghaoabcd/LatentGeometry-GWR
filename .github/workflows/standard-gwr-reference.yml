name: standard-gwr-reference

on:
  push:
    branches: [main]
    paths:
      - "src/latentgeometry_gwr/gwr.py"
      - "src/latentgeometry_gwr/bandwidth.py"
      - "src/latentgeometry_gwr/core.py"
      - "experiments/validation/basicgwr_reference_anchor.py"
      - ".github/workflows/standard-gwr-reference.yml"
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LatentGeometry-GWR
        uses: actions/checkout@v4

      - name: Checkout pinned GeoRegime-GWR baseline
        uses: actions/checkout@v4
        with:
          repository: hujinghaoabcd/GeoRegime-GWR
          ref: 428336399da87eb4ada4f97dfc5cc1993fa4b7e9
          path: _reference/georegime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned reference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "scipy==1.11.4" "pandas==2.2.3" \
            "scikit-learn==1.3.2" "mgwr==2.2.1" "libpysal==4.10.0"
          python -m pip install -e . --no-deps
          python -m pip install -e _reference/georegime --no-deps

      - name: Run Georgia standard-GWR anchor
        run: |
          python experiments/validation/basicgwr_reference_anchor.py \
            --georgia _reference/georegime/data/raw/georgia/GData_utm.csv

      - name: Upload reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: standard-gwr-reference-anchor
          path: results/validation/basicgwr_reference_anchor/summary.json
          if-no-files-found: error
